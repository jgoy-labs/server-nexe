# typos configuration — server-nexe is a multilingual project (CA/ES/EN)
# Many Catalan and Spanish words are flagged as typos by the English-only checker.

[files]
extend-exclude = [
    "knowledge/",
    "personality/data/",
    "*.dmg",
    "*.gguf",
    "node_modules/",
    ".test_venv/",
    "venv/",
    "InstallNexe.app/",
    "Nexe.app/",
    ".muthur/",
    "storage/",
]

[default.extend-words]
