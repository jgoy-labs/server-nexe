# lang-comments FP — detected:en i detected:non-en (Grup K)
# ═══════════════════════════════════════════════════════════════
#
# Restauració baseline 2026-05-11: el commit 86a9cc7 va netejar 331 entrades
# whitelist assumint que `min_tokens=3 + confidence_floor=0.35` cobriria tots
# els FP. La realitat: el detector lingua continua marcant 121 comentaris
# anglesos curts amb termes tècnics com a CA/ES (paraules curtes com "data",
# "type", "anys", "fitxer", "model" són ambigües entre llengües; també
# docstrings test "Test foo." de 2-3 tokens cauen al floor 0.35).
#
# Classificació empírica 121 findings:
# - 4 REAL CA traduïts inline (headers `Tests per X. Valida Y` →
#   `Tests for X. Validates Y` a tests/personality/{metrics,module_manager,
#   i18n})
# - 117 FP whitelistats per fitxer/glob (sota)
#
# Patrons FP per categoria:
# 1. Docstrings test ultra-curts ("""Test foo.""", """Lines N-M: ...""",
#    """Metadata has correct ID.""") — falten tokens per detector
# 2. Comentaris glossari multilingüe (regex CA/ES per intent parsing,
#    jailbreak detector patterns) — barrejant llengües intencionalment
# 3. Module headers amb paraules tècniques ("InstallNexe.app", "manifest",
#    "Salamandra", "Phi-3.5") que lingua interpreta com a noms estrangers
# 4. Comentaris inline tècnics ("# 4xx semantics", "# Catalan: ...",
#    "# 55% of RAM for model") amb context massa curt

