# ═══════════════════════════════════════════════════════════════════════════
# hardcode whitelist — Sessió Dev-I 2026-05-07
#
# Findings: 103 total
# - InstallNexe.app/ (39): exclòs per [tool.muthur] exclude_dirs
# - personality/ (6): afegit a [tool.muthur] exclude_dirs
# - tests/ top-level (7): # nosemgrep als fitxers
# - core/ (10): IPs bind addr configurables (NEXE_SERVER_HOST) + docstrings → # nosemgrep
# - installer/ (2): paths sistema ollama + IP fallback → # nosemgrep
# - memory/ (9): /tmp/ fallbacks (nosec+nosemgrep) + test patches → # nosemgrep
# - plugins/ (30): regex sanititzadors, tests seguretat, docstrings → # nosemgrep
#
# NOTA TÈCNICA: els checks hardcode usen semgrep amb tmpdir efímer.
# El check_id resultant conté el path del tmpdir (volatile cada run).
# La whitelist.toml no pot suprimir findings amb rule IDs volàtils
# (entry.rule != finding.rule → exact match requerit).
# Mecanisme real de supressió: # nosemgrep als fitxers font.
# Les entrades TOML documenten la decisió però NO suprimeixen activament.
# ═══════════════════════════════════════════════════════════════════════════

[[exception]]
rule = "hardcode.absolute_path"
path = "core/paths/**"
reason = "Docstrings d'exemples amb /opt/nexe i /tmp/nexe-test. Paths il·lustratius a docstrings de get_repo_root i _is_valid_core_root. Suprimit via # nosemgrep al codi."
expires = "2027-05-07"
authorized_by = "Jordi Goy"
ticket = "hardcode-dev-i-2026-05-07"

[[exception]]
rule = "hardcode.ip_address"
path = "core/config.py"
reason = "127.0.0.1 és el bind address per defecte del servidor local. Configurable via NEXE_SERVER_HOST env var. DEFAULT_HOST, DEFAULT_LOCALHOST_ALIASES, NexeSettings.server_host. Suprimit via # nosemgrep."
expires = "2027-05-07"
authorized_by = "Jordi Goy"
ticket = "hardcode-dev-i-2026-05-07"

[[exception]]
rule = "hardcode.absolute_path"
path = "installer/installer_ollama_install.py"
