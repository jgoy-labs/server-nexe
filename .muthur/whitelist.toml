# ═══════════════════════════════════════════════════════════════════════════
# hardcode whitelist — Sessió Dev-I 2026-05-07
#
# Findings: 103 total
# - InstallNexe.app/ (39): exclòs per [tool.muthur] exclude_dirs
# - personality/ (6): afegit a [tool.muthur] exclude_dirs
