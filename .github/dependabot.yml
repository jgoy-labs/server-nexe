version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # typer==0.9.0 és un pin VOLGUT (requirements.txt L30-34: pujar-lo trenca el build)
      # i imposa rich<14 + click<9. Mantenir typer a 0.9.x i rich a 13.x.
      # Treure aquests ignore si algun dia es migra typer a la versió moderna.
      - dependency-name: "typer"
        versions: [">=0.10"]
      - dependency-name: "rich"
        versions: [">=14"]
      # huggingface_hub>=1.14 exigeix typer>=0.20 → incompatible amb el pin typer 0.9.x
      # (ResolutionImpossible a pip-audit; va trencar el grup safe-patches 2026-06-11).
      # El requirements porta sostre <1.14. Treure això quan es migri typer.
      - dependency-name: "huggingface_hub"
        versions: [">=1.14"]
      # transformers>=5.13 trenca mlx-lm 0.31.3 a l'import (key.__module__
      # incondicional a auto_factory). Pin deliberat 5.12.1 a
      # requirements-macos.txt. Dependabot va colar 5.15.0 dins safe-patches
      # (PR #49 el 30/07, PR #53 el 19/08) — el CI ho mata, però el PR es
      # regenera cada setmana mentre l'ignore no hi sigui. NO treure fins
      # que mlx-lm / mlx-vlm puguin importar 5.13+.
      - dependency-name: "transformers"
        versions: [">=5.13"]
      # cryptography: el pin Windows ARM64 és 46.0.3 (última versió amb
      # wheel win_arm64; mesurat a PyPI). Dependabot tracta tots els
      # requirements*.txt del directory com UN sol manifest i copia el pin
      # de la base (50.0.0) a Windows. Els bumps de la base es fan a mà
      # quan OSV / pip-audit ho demanen. Les alertes de GitHub segueixen.
      - dependency-name: "cryptography"
      # mlx-vlm>=0.5 estira transformers>=5.13 (PR #41). Moure'l només amb
      # el stack MLX sencer, no sol.
      - dependency-name: "mlx-vlm"
        versions: [">=0.5"]
    groups:
      # Pegats segurs (CVE/patches/minors no-crítics) en UN sol PR ràpid de mergejar.
      # Els bumps de risc de l'stack ML/servidor queden FORA del grup → PR individual,
      # per provar-los 1-a-1 (traçabilitat de regressions, sobretot al camí d'inferència).
      safe-patches:
        patterns:
          - "*"
        exclude-patterns:
          - "uvicorn*"
          - "mlx-*"
          - "psutil"
          - "pydantic*"
          - "structlog"
          - "httpx"
          - "qdrant-client*"
          - "prometheus-client"
          # No són pegats: 0.136→0.141 / 1.3→1.6 van anar al grup #53 i van
          # trencar test_api_info_summary (StopIteration). Revisió 1-a-1.
          - "fastapi*"
          - "starlette*"
          # Cinturó: si algú treu l'ignore de cryptography, que almenys no
          # torni a amagar-se dins d'un PR de 10 paquets.
          - "cryptography"
          - "transformers*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

