name: CI

on:
  push:
    branches: [main, pre-production]
    paths-ignore:
      - ".github/badges/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/badges/**"

# Default least-privilege: jobs that need more elevate locally.
permissions:
  contents: read

jobs:
  # WS8-01: ruff/bandit/vulture were configured in pyproject.toml but never
  # invoked by CI — no lint/SAST gate blocked a PR. All three run GREEN on
  # the current tree (verified locally 2026-07-12), so they gate directly
  # with no baseline. mypy is advisory-only (lax config, unannotated code).
  static-analysis:
    name: Static analysis (ruff+bandit+vulture gates, mypy advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analysis tools (pinned)
        run: pip install ruff==0.15.6 bandit==1.9.4 vulture==2.16 mypy==1.19.0

      - name: ruff (gate)
        run: ruff check .

      - name: bandit (gate)
        run: bandit -c pyproject.toml -r core memory personality plugins installer scripts -q

      - name: vulture (gate)
        run: vulture core memory personality plugins installer scripts --min-confidence 80 --exclude "tests/,**/tests/,.venv/,InstallNexe.app/,__pycache__/"

      - name: mypy (advisory — never blocks)
        continue-on-error: true
        run: mypy . || true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (CVE scan)
        run: |
          pip-audit --requirement requirements.txt
          pip-audit --requirement requirements-macos.txt
          pip-audit --requirement requirements-linux.txt
          # requirements-windows.txt is NOT pip-audited here: it pins win_arm64-only
          # wheels (pywin32, lingua 2.2.0) that this runner cannot resolve. Its pins
          # are CVE-scanned by the OSV gate below instead (WS8-04).

      # Bundle-only deps (torch, torchvision, llama-cpp-python, transformers) are
      # installed dynamically and never appear in requirements*.txt, so pip-audit
      # above cannot see them. This gate queries OSV for those pinned versions.
      - name: Run OSV CVE gate for bundled deps (B070)
        run: |
          set +e
          python installer/check_cves_osv.py
          code=$?
          set -e
          if [ "$code" = "1" ]; then
            echo "::error::Unexpected CVE in a bundled dependency — review installer/pip-audit-ignore.txt or bump the pin"
            exit 1
          fi
          if [ "$code" = "2" ]; then
            echo "::warning::OSV API unreachable — bundle CVE gate skipped this run"
          fi

      - name: Run gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: security-audit
    # contents: read only — badge commit is handled by the separate 'badge' job
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (with coverage)
        env:
          NEXE_ENV: testing
          # Non-secret dummy values for CI. Override via GitHub Secrets if desired:
          # Settings → Secrets → Actions → NEXE_CI_API_KEY / NEXE_CI_CSRF_SECRET
          NEXE_PRIMARY_API_KEY: ${{ secrets.NEXE_CI_API_KEY || 'nexe-ci-test-key' }}
          NEXE_CSRF_SECRET: ${{ secrets.NEXE_CI_CSRF_SECRET || 'nexe-ci-csrf-secret' }}
        run: >
          pytest tests
          -m "not integration and not e2e and not slow and not gpu and not test_live"
          --cov=core --cov=memory --cov=personality --cov=plugins
          --cov-report=term
          --cov-report=xml:coverage.xml
          --cov-fail-under=84
          --tb=short -q

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          path = pathlib.Path("coverage.xml")
          if not path.exists():
            print("coverage.xml not found")
            raise SystemExit(0)

          root = ET.parse(path).getroot()
          line_rate = float(root.attrib.get("line-rate", "0") or 0)
          lines_covered = int(root.attrib.get("lines-covered", "0") or 0)
          lines_valid = int(root.attrib.get("lines-valid", "0") or 0)

          summary = f"Total line coverage: {line_rate * 100:.1f}% ({lines_covered}/{lines_valid})"
          print(summary)

          out = os.environ.get("GITHUB_STEP_SUMMARY")
          if out:
            with open(out, "a", encoding="utf-8") as f:
              f.write("## Coverage\\n\\n")
              f.write(summary + "\\n")
          PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  precompute-check:
    name: Precomputed KB Manifest
    runs-on: ubuntu-latest
    needs: security-audit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate precomputed manifest (bug #16)
        # Fast validation: does not regenerate vectors (would require
        # downloading ~1 GB of model weights per CI run). Verifies that
        # manifest.json is syntactically valid and that every source
        # hash listed in it still matches the corresponding file on
        # disk. MD edits, chunker/ingest source edits, and fastembed
        # version bumps will all trigger a failure here so the repo
        # cannot merge with a stale precomputed artefact set.
        #
        # continue-on-error: small knowledge edits between DMG builds
        # must not block CI. Authoritative check runs locally
        # (`scripts/precompute_kb.py --verify`) and at DMG build time
        # (ship-nexe.sh), where stale embeddings must be regenerated
        # before notarisation.
        continue-on-error: true
        run: |
          if [ -f knowledge/.embeddings/manifest.json ]; then
            python scripts/precompute_kb.py --verify
          else
            echo "No precomputed manifest yet; runtime fallback active."
          fi

  layering:
    name: Layering Gate (#471)
    runs-on: ubuntu-latest
    needs: security-audit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check inter-package layering (freeze coupling debt)
        # Stdlib-only AST gate: fails if a NEW import-time cross-package import
        # (core/memory/personality/plugins) appears outside the frozen baseline.
        # Deferred (function-local) imports are the allowed escape hatch.
        run: python scripts/check_layering.py

  badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # contents: write isolated here — only this job needs to commit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-xml

      - name: Install badge deps
        run: python -m pip install --upgrade defusedxml

      - name: Generate coverage badge
        run: python .github/scripts/generate_coverage_badge.py coverage.xml .github/badges/coverage.svg

      - name: Commit coverage badge
        continue-on-error: true
        run: |
          set -euo pipefail

          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "Coverage badge unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/badges/coverage.svg
          git commit -m "chore: update coverage badge"
          git push
