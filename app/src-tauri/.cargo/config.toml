# Build hygiene — minimize disclosure of the builder's FS paths.
#
# `[profile.release] strip = "symbols"` (a `Cargo.toml`) ja elimina DWARF debug
# info al release binary. El `--remap-path-prefix` següent complementa per a
# panic backtraces i `RUST_BACKTRACE=1` output.
#
# Si algú executa `strings target/release/nexe-app | grep $HOME`, no ha de
# retornar rutes del machine builder (casa del dev, CI path, etc.).

# F046: rustflags anteriors amb --remap-path-prefix=@CARGO_HOME=@cargo eliminats
# perquè eren NO-OP (Cargo no expandeix $VAR al config.toml).
# El remap real (RUSTFLAGS amb $HOME i $CARGO_HOME expandits + SOURCE_DATE_EPOCH):
#   ./scripts/reproducible-build.sh  ← usar per builds reproduïbles

# Nota: les variables com $HOME o $CARGO_HOME NO s'expandeixen al config.toml.
# Per un build reproduïble amb remap dels paths reals + SOURCE_DATE_EPOCH:
#   ./scripts/reproducible-build.sh          (des del repo root)
# Aquest script injecta $HOME, $CARGO_HOME i SOURCE_DATE_EPOCH via RUSTFLAGS
# abans d'executar cargo build --release.
#
# SLSA maturity: baseline (L1-equivalent). Veure ADR-0015 per path cap a L3
# (sigstore + attested builder + bundle reproducibility).
