name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# S07 F063: cancel·la runs duplicats quan es push multiples commits a la mateixa PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check + clippy + test + audit + vitest
    # S07 F062: timeout explicit (default GitHub = 360 min = 6h)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # S07 F018: matrix cross-platform (README diu "multi-platform" — ara de veritat)
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned to SHA40. Dependabot (.github/dependabot.yml) will bump them.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Linux WebKitGTK deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-04-18
        with:
          components: clippy, rustfmt

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cache cargo
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: pnpm setup
        # Version ve de package.json `packageManager` (evita ERR_PNPM_BAD_PM_VERSION)
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0

      - name: Node setup
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: cargo fmt check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo clippy (warnings = error)
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      # C70: clippy --all-targets warning-only (38 warnings actuals en tests/benches).
      # No bloqueja CI; un sprint dedicat els netejara.
      - name: clippy all targets (warning-only)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked 2>&1 | tee clippy-all.log
        continue-on-error: true

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: cargo audit (vulnerability scan)
        working-directory: src-tauri
        run: cargo audit --deny warnings

      # B20 F7-RT2 fix (Sprint 0.18): CI bloqueja si una review-date de
      # .cargo/audit.toml ha expirat. SECURITY.md/CHANGELOG afirmen aquest
      # comportament; abans de F7-RT2 el script només corria via verify.sh.
      - name: check cargo audit ignore dates not expired
        run: bash scripts/check-audit-dates.sh

      # C31: pnpm audit --prod bloquejant (prod deps a produccio = blocker).
      - name: pnpm audit --prod (blocker)
        run: pnpm audit --prod --audit-level=moderate

      # C31: pnpm audit complet (dev deps incloses: vite/vitest/tauri-cli CVEs).
      # warning-only: deps dev no van a produccio, no bloqueja CI.
      - name: pnpm audit all (warning-only)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: vite build
        run: pnpm run build

      - name: vitest
        run: pnpm test

      # Codex audit 2026-05-06: externalBin declarat però sidecar no buildat a CI.
      # Stub mínim per al triple de la plataforma — suficient per al smoke --no-bundle.
      # Quan el sidecar real existeixi, substituir per build-sidecar.sh.
      - name: sidecar stub (CI smoke only)
        run: |
          TRIPLE=$(rustc -vV | grep '^host:' | awk '{print $2}')
          STUB="src-tauri/binaries/nexe-sidecar-$TRIPLE"
          if [ ! -f "$STUB" ]; then
            printf '#!/bin/sh\necho "stub"\n' > "$STUB"
            chmod +x "$STUB"
          fi

      # S07 F044: smoke check del packaging end-to-end.
      # --no-bundle evita generar DMG/AppImage/MSI (rapid, sense artifacts).
      # Si trenca, detectem problemes de packaging ABANS del release pipeline.
      - name: tauri build smoke (no bundle)
        run: pnpm tauri build --no-bundle

  # B29: MSRV check — Cargo.toml declares rust-version = "1.88" but CI always runs
  # with rust-toolchain.toml (1.94.1). If any code silently uses a 1.94-only feature,
  # the MSRV claim is broken without anyone noticing. This job catches that drift.
  msrv-check:
    name: MSRV 1.88 check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Linux WebKitGTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: cargo check at MSRV 1.88
        working-directory: src-tauri
        run: cargo check --locked
