name: Weekly Bundle Smoke Test

# C45: CI smoke --no-bundle -> release path cec.
# Aquest workflow fa un build complet amb bundle real (DMG/AppImage/MSI) setmanalment.
# Detecta trencaments de packaging que --no-bundle no detecta.
on:
  schedule:
    - cron: '0 3 * * 1'  # Dilluns 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-mac-arm64:
    name: bundle smoke macOS arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: pnpm setup
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0

      - name: Node setup
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Bundle (release, unsigned)
        run: pnpm tauri build

      - name: Verify artifact exists
        run: |
          ls -la src-tauri/target/release/bundle/dmg/*.dmg
          echo "Bundle smoke OK"
