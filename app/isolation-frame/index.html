<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Isolation frame — nexe-app</title>
    <!--
    B24: Defense-in-depth CSP for the isolation frame itself.
    Tauri serves this document via the tauri://localhost bundle (not the network),
    so the main-window CSP already applies. This meta tag adds a second layer: if
    any tooling or misconfiguration ever exposes the frame directly (e.g. a dev
    server with wrong routing), the browser still enforces a strict policy.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none';">
</head>
<body>
    <!--
    Tauri Isolation Pattern entrypoint (ADR-0013 active, Sprint 0.15 #3).
    This document is NOT user-facing. Tauri loads it as an intermediate
    frame to validate every IPC payload before it reaches Rust.

    Script kept external (no inline) to stay CSP-clean.

    B25: isolation.js has no SRI integrity= attribute here. This is intentional:
    Tauri serves isolation.js from the compiled app bundle (tauri://localhost),
    NOT from the network. A MITM cannot substitute isolation.js in transit because
    there is no network path. Adding SRI would require computing the hash at build
    time and injecting it here, which is out of scope for the current pipeline.
    The absence of SRI does not weaken the security model in the Tauri context.
    -->
    <script src="isolation.js"></script>
</body>
</html>
