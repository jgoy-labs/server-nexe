# ─────────────────────────────────────────────────────────────
# Nexe RAG Module - Manifest TOML
# ─────────────────────────────────────────────────────────────
# ModuleID: rag
# Versió: 0.9.0
# Autoria: Nexe Team (Jordi Goy)
# Data creació: 2025-10-27
# Última actualització: 2025-10-27
# ─────────────────────────────────────────────────────────────

[module]
module_id = "rag"
name = "rag"
version = "0.1"
description = "Modul RAG: introspeccio (health/info) i fonts internes per al pipeline de xat. La cerca vectorial real del xat viu a MemoryAPI/Qdrant; la superficie standalone /rag/* (matcher de substrings + upload sense backend) es va retirar (WS6-01/02)"
author = "Nexe Team (Jordi Goy)"
category = "memory"
created = "2025-10-27"
last_updated = "2025-10-27"

[module.status]
enabled = true
priority = 10
auto_start = true

[module.capabilities]
has_api = true
has_ui = false
has_specialist = true
has_tests = true
has_workflow = false

[module.integration]
workflow_engine = false
ui_control_center = false

[module.endpoints]
router_prefix = "/rag"
ui_path = ""
public_routes = ["/health", "/info"]
protected_routes = []

# ─────────────────────────────────────────────────────────────
# DEPENDENCIES
# ─────────────────────────────────────────────────────────────

[dependencies]
required = [
  "embeddings"
]

# ─────────────────────────────────────────────────────────────
# CAPABILITIES
# ─────────────────────────────────────────────────────────────

[capabilities]
# WS6-01/02: the standalone /rag surface (keyword_search substring matcher,
# temp_upload_rag, catalog_rag) was retired. Only the internal PersonalityRAG
# source (chat pipeline fallback) and health/info introspection remain.
exposed = [
  "personality_rag"
]

# ─────────────────────────────────────────────────────────────
# HEALTH & MONITORING
# ─────────────────────────────────────────────────────────────

[health]
check_endpoint = "memory.rag.health:check"
check_interval_seconds = 60

# ─────────────────────────────────────────────────────────────
# WORKFLOW INTEGRATION
# ─────────────────────────────────────────────────────────────

[workflow]
# WS6-01/02: the memory.rag.workflow subtree was deleted with the /rag surface.
nodes = []

# ─────────────────────────────────────────────────────────────
# SYSTEM SPECIALISTS
# ─────────────────────────────────────────────────────────────

[specialists]
handlers = [
  "memory.rag.specialists.rag_specialist"
]

# ─────────────────────────────────────────────────────────────
# I18N CONFIGURATION
# ─────────────────────────────────────────────────────────────

[i18n]
supported_languages = ["ca-ES", "en-US", "es-ES"]
default_language = "ca-ES"
languages_path = "memory/rag/languages"

# ─────────────────────────────────────────────────────────────
# API & UI CONFIGURATION
# ─────────────────────────────────────────────────────────────

[api]
router = "memory.rag.manifest:router_public"
prefix = "/ui-control/rag"
tags = ["rag"]

[api.endpoints]
# WS6-01/02: document/search/upload endpoints retired; only introspection left.
health = "GET /rag/health"
info = "GET /rag/info"

[ui]
# WS6-01/02: the /rag admin UI (memory/rag/ui) was deleted.
enabled = false
ui_path = ""
assets_path = ""

# ─────────────────────────────────────────────────────────────
# DEFAULT CONFIGURATION
# ─────────────────────────────────────────────────────────────

[config]
top_k = 5
similarity_threshold = 0.7
circuit_breaker_threshold = 5
circuit_breaker_timeout = 60
max_concurrent_searches = 3

[config.vector_search]
default_top_k = 5
min_similarity = 0.7
max_results = 50

[config.circuit_breaker]
failure_threshold = 5
timeout_seconds = 60
recovery_timeout = 120

[config.sources]
# WS6-01/02: only the personality source survives (chat fallback).
personality = true

# ─────────────────────────────────────────────────────────────
# PATHS & RESOURCES
# ─────────────────────────────────────────────────────────────

[paths]
module_root = "memory/rag"
docs = "memory/rag/docs"
tests = "memory/rag/tests"
ui = "memory/rag/ui"

# ─────────────────────────────────────────────────────────────
# STORAGE DECLARATIONS (Auto-Clean)
# Cada path que RAG escriu a storage/ ha d'estar declarat aquí.
# El sistema Auto-Clean només gestiona paths declarats.
# ─────────────────────────────────────────────────────────────

[module.storage]

[[module.storage.paths]]
path = "storage/documents"
type = "document_store"
format = "mixed"
action = "PERMANENT"
description = "Documents i coneixement del sistema - MAI esborrar"
auto_clean = false

[[module.storage.paths]]
path = "storage/rag/vectors"
type = "vector_store"
format = "binary"
action = "PERMANENT"
description = "Vector stores FAISS - MAI esborrar automàticament"
auto_clean = false

[[module.storage.paths]]
path = "storage/rag/indexes"
type = "index_metadata"
format = "json"
action = "PERMANENT"
description = "Metadades dels índexs vectorials - MAI esborrar"
auto_clean = false

[module.storage.protection]
# Fitxers que MAI s'han de tocar - TOT és crític per RAG
protected_patterns = ["*.faiss", "*.index", "*.db", "*.json", "*.bin"]
