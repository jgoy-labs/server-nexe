[project]
name = "server-nexe"
version = "1.0.4-beta"
requires-python = ">=3.11"

# ═══════════════════════════════════════════════════════════════════════════
# Static analysis tooling — baseline config
# ═══════════════════════════════════════════════════════════════════════════
# Rationale: tests/ uses patterns that are idiomatic in pytest but flagged by
# bandit/ruff defaults (assert, unused fixtures, mock fixtures with hardcoded
# tokens). To keep the signal-to-noise ratio useful, tests/ is silenced for
# style/security rules that don't translate; production code keeps every rule.
#
# Each tool reads its own [tool.X] section when invoked from the project root.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use unused-import (re-export pattern), unused-variable
# (fixture binding), == True (explicit truthy assert), one-liners (concise
# expectation tables), f-string without placeholders (test-name strings).
"tests/**/*.py" = ["F401", "F841", "E712", "E701", "E702", "F541", "E741"]
"**/test_*.py" = ["F401", "F841", "E712", "E701", "E702", "F541", "E741"]
"**/tests/**/*.py" = ["F401", "F841", "E712", "E701", "E702", "F541", "E741"]
"**/conftest.py" = ["F401", "F841"]

[tool.bandit]
# Tests are excluded entirely: B101 (assert) is the canonical pytest pattern,
# B105/B106 (hardcoded passwords) are mock fixtures, B603/B604 (subprocess)
# are integration test invocations. Production code is scanned in full.
exclude_dirs = [
    "tests",
    "*/tests",
    "*/tests/*",
    ".venv",
    "InstallNexe.app",
    "__pycache__",
]
skips = ["B404"]  # import subprocess — never insecure, risk is at usage (B603/B607)

[tool.vulture]
# 60% confidence floods the report with false positives from indirect dispatch
# (plugin loader, FastAPI router decoration, slowapi limit tags). 80%+ catches
# the real dead code: 90%-confidence unused imports are essentially always real.
exclude = ["tests/", "**/tests/", ".venv/", ".test_venv/", "InstallNexe.app/", "__pycache__/"]
min_confidence = 80

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# 8 conftest.py exist at different paths — explicit_package_bases lets mypy
# distinguish them by their containing package instead of treating same-named
# files as duplicates.
explicit_package_bases = true
namespace_packages = true
exclude = [
    "InstallNexe\\.app/",
    "\\.venv/",
    "tests/",
    "__pycache__/",
    "conftest\\.py",
]

[tool.pyright]
# Pyright type checker.
# InstallNexe.app/ is Python 3.12 stdlib bundled (tkinter, turtle, pip/_vendor...)
# and is NOT project code: 9741 of 10932 initial findings belong there.
include = ["core", "memory", "plugins", "personality", "specialists", "installer"]
exclude = [
    "**/InstallNexe.app",
    "**/Nexe.app",
    "**/.venv",
    "**/.test_venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "tests",
    "scripts",
    "dev-tools",
]
pythonVersion = "3.11"
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.lizard]
# InstallNexe.app i Nexe.app són bundles pre-compilats (stdlib Python bundlada
# + binaris), no codi font del projecte. Els seus fitxers generen fals positius
# de complexitat (ex: re/_parser.py CCN=121) que no hem de corregir nosaltres.
exclude = [
    ".test_venv/*",
    "InstallNexe.app/*",
    "Nexe.app/*",
]

[tool.muthur]
# Auditoria zero 2026-05-15 (post-restructura DEV/OSS): muthur només mira
# codi font + tests. Tot el contingut intern (diari, eines QA, runtime data,
# bundles pre-compilats, scripts auxiliars no-prod) queda fora.
#
# El default EXCLUDED_DIRS de muthur cobreix .venv/node_modules/dist/build/
# target/bundle/__pycache__/.git. Aquí ampliem amb les carpetes pròpies del
# projecte que NO són codi a auditar.
exclude_dirs = [
    "diari",           # 16 MB, ~10k docs interns (mega-tests, informes, _chaos/chaos_c*.py)
    "specialists",     # eines QA internes (no public, no prod)
    "nexe",            # eines internes
    "storage",         # runtime data (sessions, qdrant, etc.)
    ".muthur",         # config + audits del propi muthur
    "InstallNexe.app", # bundle Python pre-compilat (mateix motiu que lizard)
    "Nexe.app",        # bundle SwiftUI pre-compilat
    "uploads",         # plugins/web_ui_module/ui/uploads — runtime
    "worktrees",       # git worktrees (còpies paral·leles, duplicats falsos positius)
    "tests",           # tests no són codi de producció: ruff/bandit/mypy/vulture
                       # ja els excloen individualment; semgrep-security genera
                       # fals positius (denylist patterns, fake tokens als tests
                       # de validació). Coherent amb la resta de tools.
]
exclude_globs = [
    "dev-tools/reports/**",                  # informes interns auditories velles
    "installer/swift-wizard/.build/**",      # build artifacts Swift
    "scripts/export_source_pdf.py",          # eina dev-only (no public)
    "scripts/export_whitepaper_pdf.py",      # eina dev-only (no public)
    "**/.module_cache.json",                 # runtime cache
    "**/*.bak-*",                             # backups locals (whitelist, etc.)
]

[tool.muthur.license]
# Auditoria zero 2026-05-15: llicències OSS compatibles amb AGPL-3.0+commercial
# dual-license del projecte. Validats per consens 4 IAs (Claude/Codex/Gemini +
# anàlisi automàtic Turing). Tots són permisius o copyleft feble (MPL) sense
# riscos legals reals.
#
# Inclou variants exactes de noms que pip-licenses retorna (composites com
# "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0" són reals als deps
# i tots els components individuals són OSS-compatibles).
allowed = [
    # MIT family
    "MIT", "MIT License", "MIT-CMU",
    # BSD family
    "BSD-3-Clause", "BSD-2-Clause", "0BSD",
    "BSD License", "BSD",
    "3-Clause BSD License",
    # Apache family
    "Apache-2.0", "Apache License 2.0", "Apache Software License",
    "Apache-2.0 AND MIT",
    "Apache-2.0 AND CNRI-Python",
    # ISC family
    "ISC", "ISC License", "ISC License (ISCL)",
    # PSF
    "PSF-2.0", "Python Software Foundation License",
    # Mozilla
    "MPL-2.0", "Mozilla Public License 2.0 (MPL 2.0)",
    "MPL-2.0 AND MIT",
    # AGPL (propi)
    "AGPL-3.0-or-later", "AGPL-3.0",
    "GNU Affero General Public License v3 or later (AGPLv3+)",
    # Public domain / Zlib / CC0
    "Unlicense", "The Unlicense (Unlicense)",
    "Public Domain", "Zlib", "CC0-1.0",
    # Composites coneguts (numpy, etc.)
    "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0",
]

# Resolució 2026-05-15 (post-investigació empírica):
#
# - fastembed 0.8.0 — License field metadata = "Apache License" (vs classifier
#   "Other/Proprietary License" mal posat upstream). Patch muthur amb --from=meta
#   ara prioritza el camp License canonical. "Apache License" afegit a allowed.
#
# - py_rust_stemmers 0.1.5 — License field UNKNOWN al metadata però LICENSE
#   file al dist-info (`licenses/LICENSE`) diu "MIT License" clarament
#   (verificat 2026-05-15). Whitelist específic al .muthur/whitelist.toml.
#
# - sentencepiece — no és dep instal·lada del projecte (només apareixia abans
#   per quirk de pip-licenses amb venv buit).

